              game_master_taken: "already has a game master"
            user_id:
              already_at_table: "is already at this table"
        sheet_template:
          duplicate_equipment_option: "%{part} › %{field} › %{option}: the equipment option %{letter} is declared twice"
          duplicate_key: "%{part}: the key “%{key}” is used by two fields"
          duplicate_spell_group: "The group of spells “%{group}” is declared twice"
          duplicate_step: "The step “%{step}” is declared twice"
          field_without_step: "“%{field}” is asked at creation, but is in no step"
          invalid_equipment_line: "%{part} › %{field} › %{option}: a line of the option %{letter} must be an item or a choice, not both nor none"
          invalid_key: "%{part}: the key “%{key}” must start with a lower case letter, then hold only lower case letters without accents, digits and _"
          invalid_label: "%{part} › %{field}: the label must be filled in, on one line, in %{count} characters at most"
          invalid_level_table: "%{part} › %{field} › %{option}: the spell table “%{table}” must give a number for each of the 20 levels"
          invalid_spell_group_key: "The group of spells “%{group}”: the key “%{key}” must start with a lower case letter, then hold only lower case letters without accents, digits and _"
          invalid_spell_group_label: "The group of spells “%{group}”: the label must be filled in, on one line, in %{count} characters at most"
          invalid_step_key: "The step “%{step}”: the key “%{key}” must start with a lower case letter, then hold only lower case letters without accents, digits and _"
          invalid_step_label: "The step “%{step}”: the label must be filled in, on one line, in %{count} characters at most"
          missing_hit_die: "%{part} › %{field}: every class must give its hit die (hit_die)"
          missing_parameter: "%{part} › %{field}: the setting “%{parameter}” is required"
          missing_spell_group_parameter: "The group of spells “%{group}”: the setting “%{parameter}” is required"
          missing_spell_table: "%{part} › %{field} › %{option}: the spell table “%{table}” is missing, the group “%{group}” reads it"
          name_step_count: "One step, and only one, must ask the name of the character"
          several_damage_fields: "%{part}: only one field can receive the damage"
          unknown_effect: "%{part} › %{field} › %{option}: the effect “%{effect}” is unknown"
          unknown_effect_target: "%{part} › %{field} › %{option}: the effect “%{effect}” names a field that does not exist (%{target})"
          unknown_effect_value: "%{part} › %{field} › %{option}: “%{value}” is not a known value of “%{effect}”"
          unknown_item_group: "%{part} › %{field} › %{option}: the item group “%{group}” does not exist on the item sheet"
          unknown_item_property: "Ready-made item “%{item}”: the property “%{property}” does not exist on the item sheet"
          unknown_modifier: "%{part} › %{field}: the modifier rule “%{modifier}” is unknown"
          unknown_option: "%{part} › %{field}: “%{setting}” describes an option that does not exist (%{option})"
          unknown_parameter: "%{part} › %{field}: the setting “%{parameter}” is unknown for this type of field"
          unknown_rule: "%{part} › %{field}: the computing rule “%{rule}” is unknown"
          unknown_section: "The step “%{step}” names a section that does not exist: %{section}"
          unknown_spell_group_changes: "The group of spells “%{group}”: the change rule “%{changes}” is unknown"
          unknown_spell_group_parameter: "The group of spells “%{group}”: the setting “%{parameter}” is unknown"
