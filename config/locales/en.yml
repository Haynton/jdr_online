          unknown_step_parameter: "The step “%{step}”: the setting “%{parameter}” is unknown"
          unknown_type: "%{part} › %{field}: the type “%{type}” is unknown"
          wrong_effect_target: "%{part} › %{field} › %{option}: the effect “%{effect}” must name “%{expected}” fields (%{target})"
          wrong_reference: "%{part} › %{field}: “%{parameter}” must name a “%{expected}” field (%{target})"
        user:
          attributes:
            username:
              invalid: "can only contain letters, digits, dashes (-) and underscores (_)"
              taken: "is already taken by another player"
