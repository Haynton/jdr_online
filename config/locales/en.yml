# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  activerecord:
    attributes:
      user:
        locale: "Language"
  app_name: "JDR Online"
  devise:
    passwords:
      edit:
        get_a_new_link: "Get a new link"
        submit: "Save and sign in"
        title: "New password"
      new:
        back_to_sign_in: "Back to sign in"
        remember_it: "Remember it?"
        # Overrides devise-i18n: its sentence was far too long for a button
        send_me_reset_password_instructions: "Send the link"
        subtitle: "Enter the email of your account."
        title: "Get a link"
    registrations:
      edit:
        browser_language: "Browser language"
        title: "My account"
      new:
        already_registered: "Already registered?"
        sign_in: "Sign in"
        submit: "Create my account"
        subtitle: "A few seconds and you are ready to play."
        title: "Create an account"
    sessions:
      new:
        create_account: "Create an account"
        forgot_password: "Forgot your password?"
        new_here: "New here?"
        submit: "Sign in"
        subtitle: "Find your game tables."
        title: "Sign in"
    shared:
      # Overrides devise-i18n: shorter, without brackets, as in the mockups
      minimum_password_length:
        one: "%{count} character minimum"
        other: "%{count} characters minimum"
  # Each language is named in its own language, so that a user can always find theirs
  locale_names:
    en: "English"
    fr: "Français"
  pages:
    home:
      title: "Home"
      description: "Find me in app/views/pages/home.html.erb"
  shared:
    navbar:
      log_in: "Log in"
      log_out: "Log out"
      sign_up: "Sign up"
    password_visibility_button:
      show_password: "Show password"
    theme_choice:
      dark: "Dark"
      light: "Light"
      system: "System"
    theme_selector:
      label: "Theme"
  simple_form:
    error_notification:
      default_message: "Please review the problems below."
    required:
      # Hidden from screen readers: the field itself carries the required attribute, which they announce
      html: '<span class="text-muted" aria-hidden="true">*</span>'
