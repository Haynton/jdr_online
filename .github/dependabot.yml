version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # Major versions can break the app and the project lasts two weeks: we take
  # minor and patch updates only, and upgrade a major version on purpose, after testing it
  ignore:
  - dependency-name: "*"
    update-types: ["version-update:semver-major"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
