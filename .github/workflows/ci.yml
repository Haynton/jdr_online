name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Ubuntu is pinned instead of ubuntu-latest: when GitHub moved ubuntu-latest to 26.04,
# setup-ruby had no prebuilt Ruby 3.3.5 for it and every job failed. Upgrade on purpose, with Ruby
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Lint Ruby code
        run: bin/rubocop -f github

  # CLAUDE.md is kept by Anthony (Haynton): a pull request from anyone else that changes it fails, with a message
  # telling to write the change in the description of the pull request instead (rule at the top of CLAUDE.md)
  claude_md_owner:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Only Haynton changes CLAUDE.md
        env:
          PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$PULL_REQUEST_AUTHOR" = "Haynton" ]; then exit 0; fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx "CLAUDE.md"; then
            echo "::error file=CLAUDE.md::Only Haynton changes CLAUDE.md. Write the change in the description of the pull request instead."
            exit 1
          fi

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run tests
        run: bin/rails db:test:prepare test test:system
      - name: Keep screenshots from failed system tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
